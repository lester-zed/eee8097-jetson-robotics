services:
  robot-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    image: robot-dev:latest
    container_name: robot-dev

    runtime: nvidia
    network_mode: host

    stdin_open: true
    tty: true
    privileged: true

    working_dir: /workspace

    volumes:
      - ../src:/workspace/src
      - ../configs:/workspace/configs
      - ../data:/workspace/data
      - ../models:/workspace/models
      - ../logs:/workspace/logs
      - ../requirements.txt:/workspace/requirements.txt
      - ../models:/workspace/models:ro

      # Local Jetson X11 socket. This is not required by SSH X11 forwarding
      # (localhost:10.0 uses sshd's TCP proxy), but keeping it also allows
      # local-display workflows later.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # Dedicated Xauthority cookie generated by scripts/run_docker.sh.
      - ${DOCKER_XAUTH_FILE}:/tmp/.docker.xauth:ro

    environment:
      - DISPLAY=${JETSON_DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_X11_NO_MITSHM=1

      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    command: /bin/bash

    devices:
      - "${ROARM_DEVICE:-/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_888387d8d017f011b9526a7db887153e-if00-port0}:/dev/ttyROARM"
      - "${RPLIDAR_DEVICE:-/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_c877520e295df0119ae253401045c30f-if00-port0}:/dev/ttyRPLIDAR"
      - "${CAMERA_DEVICE:-/dev/video0}:/dev/video0"

    group_add:
      - "${DIALOUT_GID:-20}"
