services:
  robot-ros2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    image: eee8097-ros2-humble:latest
    container_name: eee8097-ros2
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /workspace/src/ros2_ws

    volumes:
      - ../src:/workspace/src
      - ${ROS2_XAUTH_FILE}:/tmp/.ros2.xauth:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      - DISPLAY=${ROS2_DISPLAY:-}
      - XAUTHORITY=/tmp/.ros2.xauth
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}

    devices:
      # /dev/null is used only for plan-only mode.  The helper script replaces
      # it with the stable by-id RoArm device for real-state/execution modes.
      - "${ROS2_ROARM_DEVICE:-/dev/null}:/dev/ttyROARM"

    group_add:
      - "${DIALOUT_GID:-20}"

    command: /bin/bash
