# EEE8097 Camera + RPLIDAR + RoArm modular pipeline configuration
#
# Current recommended phase:
#   REAL Camera + REAL RPLIDAR + MOCK RoArm.
# Keep real automatic motion disabled until X/Y/yaw and grasp Z have both been validated.

app:
  target: tissue_pack
  ssh: true
  detection_timeout_s: 20.0

camera:
  mode: real                 # mock | real
  index: 0

  model_path: /workspace/models/tissue_pack_yolov8n_v1.pt
  confidence: 0.55
  stable_frames: 3
  stability_tolerance_px: 40
  imgsz: 640
  device: 0
  show_preview: true

  # Current provisional intrinsics. Replace with a real camera calibration later.
  fx_px: 900.0
  fy_px: 900.0
  cx_px: 320.0
  cy_px: 240.0

  # Initial relative calibration already present on main.
  origin_in_base_mm: [-260.0, 0.0, -70.0]
  yaw_in_base_deg: 180.0

lidar:
  mode: real                 # mock | real
  device: /dev/ttyRPLIDAR
  sdk_binary: null
  baudrate: 460800
  scan_count: 4
  timeout_s: 12.0

  front_angle_deg: 180.0
  angle_sign: 1
  target_half_width_deg: 8.0

  min_range_mm: 120.0
  max_range_mm: 300.0
  min_quality: 1
  min_points: 2
  outlier_mm: 100.0

  # Initial relative calibration already present on main.
  origin_in_base_mm: [-260.0, 0.0, -100.0]

  mock_distance_mm: 350.0

localization:
  # RPLIDAR only provides X/Y. Z is a configured grasp-point height.
  target_z_mm: -110.0

  # Approve only after checking several physically measured X/Y target positions.
  calibration_approved: true

  # Separate approval for the configured grasp Z. Real mode requires both flags.
  target_z_approved: true

arm_mount:
  origin_in_base_mm: [0.0, 0.0, 0.0]
  yaw_in_base_deg: 0.0

planner:
  approach_distance_mm: 80.0
  pregrasp_height_mm: 300.0
  lift_height_mm: 200.0

  grasp_y_offset_mm: -30.0

  tool_angle_rad: 3.14
  cartesian_speed: 0.15
  gripper_open_rad: 2.20
  gripper_closed_rad: 3.14

workspace:
  min_x_mm: -430.0
  max_x_mm: 500.0
  min_y_mm: -100.0
  max_y_mm: 100.0
  min_z_mm: -120.0
  max_z_mm: 280.0
  max_radius_mm: 460.0

arm:
  mode: real                 # mock | real
  device: /dev/ttyROARM
  baudrate: 115200

  allow_real_motion: true
  confirm_clearance: true
  require_typed_confirmation: true
  confirmation_phrase: EXECUTE ONE GRASP

  one_grasp_per_process: true
  feedback_tolerance_mm: 20.0
  waypoint_timeout_s: 25.0
  feedback_poll_s: 0.20
  feedback_initial_delay_s: 1.0
  uart_response_timeout_s: 2.0

  gripper_settle_s: 1.0
  gripper_speed_steps_s: 250
  gripper_acceleration: 10
  gripper_motion_margin_s: 0.75

  min_voltage_v: 7.0
  max_voltage_v: 13.0

pipeline:
  allow_provisional_in_mock: true

  # Run a second Camera + RPLIDAR observation immediately before planning.
  # The second observation becomes the target that is actually planned/executed.
  pre_execute_recheck: true
  recheck_timeout_s: 8.0

  # Reject a target that moved significantly between the two observations.
  max_recheck_center_shift_px: 60.0
  max_recheck_target_shift_mm: 60.0

  # Reject a noisy/mixed RPLIDAR sector before it reaches the planner.
  max_range_mad_mm: 60.0
  max_range_span_mm: 250.0

# Existing standalone manual-arm test configuration retained.
manual_arm_test:
  enabled: true
  allow_real_motion: true
  confirm_clearance: true
  coordinates_approved: true

  execute_confirmation_phrase: EXECUTE MANUAL ROARM GRASP
  reset_confirmation_phrase: RESET ROARM TO INITIAL POSITION
  gripper_confirmation_phrase: MOVE ROARM GRIPPER

  reset_wait_s: 8.0
  reset_timeout_s: 25.0

  feedback_tolerance_mm: 12.0
  uart_response_timeout_s: 2.0
  feedback_initial_delay_s: 1.0
  waypoint_timeout_s: 25.0
  feedback_poll_s: 0.50
  gripper_settle_s: 1.0

  tool_angle_rad: 3.14
  cartesian_speed: 0.20
  gripper_open_rad: 2.2
  gripper_closed_rad: 3.14

  gripper_speed_steps_s: 400
  gripper_acceleration: 10
  gripper_motion_margin_s: 0.75

  waypoints:
    pregrasp: [-310, -5, 230]
    grasp:    [-380, -20, -100]
    lift:     [-350, -5, 100]
    retreat:  [-310, -5, 230]
