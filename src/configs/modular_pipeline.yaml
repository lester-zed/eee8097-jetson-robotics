# EEE8097 Camera + RPLIDAR + RoArm modular pipeline configuration
#
# Operator-validated hardware profile (2026-08-19):
#   REAL Camera + REAL RPLIDAR + REAL RoArm.
# This file can command physical motion after the typed confirmation gate.
# Preserve measured geometry and motion values unless a change is backed by a
# recorded hardware experiment.

app:
  target: tissue_pack
  ssh: true
  detection_timeout_s: 20.0

camera:
  mode: real                 # mock | real
  index: 0

  model_path: /workspace/models/tissue_pack_yolov8n_v1.pt
  confidence: 0.90
  stable_frames: 3
  stability_tolerance_px: 40
  imgsz: 640
  device: 0
  show_preview: true

  # Current provisional intrinsics. Replace with a real camera calibration later.
  fx_px: 900.0
  fy_px: 900.0
  cx_px: 320.0
  cy_px: 240.0

  # Initial relative calibration already present on main.
  origin_in_base_mm: [-260.0, 0.0, -70.0]
  yaw_in_base_deg: 180.0

lidar:
  mode: real                 # mock | real
  device: /dev/ttyRPLIDAR
  sdk_binary: null
  baudrate: 460800
  scan_count: 4
  timeout_s: 12.0

  front_angle_deg: 180.0
  angle_sign: 1
  target_half_width_deg: 8.0

  min_range_mm: 50.0
  max_range_mm: 300.0
  min_quality: 1
  min_points: 2
  outlier_mm: 100.0

  # Initial relative calibration already present on main.
  origin_in_base_mm: [-260.0, 0.0, -100.0]

  mock_distance_mm: 350.0

localization:
  # RPLIDAR only provides X/Y. The current grasp task therefore keeps the
  # operator-approved tissue-package task-plane Z fixed at -110 mm.
  target_z_mm: -110.0

  calibration_approved: true
  target_z_approved: true

  # 2026-08-19 workspace-first grasp-waypoint calibration.
  #
  # Step 1: define an XY motion workspace that contains every manually taught
  # point, including the far-left point whose pre-offset 3-D radius is 463.9 mm.
  # Step 2: fit all 11 Camera + RPLIDAR / T=105 pairs inside that authorized
  # region. A global bilinear model supplies smooth interpolation across the
  # workspace. A compact local residual layer then corrects only neighborhoods
  # around measured teach anchors; it decays exactly to zero 20 mm away.
  #
  # The planner retains the historical +10/-15 mm fine-tune. Calibration output
  # therefore predicts the taught grasp command minus those planner offsets.
  command_calibration:
    enabled: true
    model: bilinear_local_xy
    calibration_id: tissue-grasp-waypoint-20260819-v3
    origin_mm: [-377.70475532, 2.01385567]

    # Global bilinear baseline, fitted to all 11 taught positions.
    # For dx=x-origin_x, dy=y-origin_y:
    # x_pre = a*dx + b*dy + c*dx*dy + d
    # y_pre = e*dx + f*dy + g*dx*dy + h
    x_coefficients: [1.11871727, 0.03403679, 0.00039473493, -377.68143017]
    y_coefficients: [0.08296279, 1.40788329, 0.00411045625, -8.48493033]

    # Compact residual correction fitted after the global model.
    # Each row is [nominal_x, nominal_y, coefficient_x, coefficient_y].
    # Wendland-C2 support is local and reaches exactly zero at 20 mm, so
    # unsupported parts of the workspace retain the global bilinear mapping.
    local_residual:
      basis: wendland_c2
      support_radius_mm: 20.0
      anchors:
        - [-434.37727188858, -0.64053321778, 3.01392748, 3.36852146]
        - [-436.71506955274, 57.95751961658, -0.00227320, -0.77627341]
        - [-435.20792045163, -59.55801804481, 0.43679797, -1.41753196]
        - [-393.84037929164, 46.01972015587, 2.04150198, -2.24995951]
        - [-380.99585712086, 1.14980140563, -10.36625550, 2.92094104]
        - [-380.79562174750, -35.78593343269, 2.57815566, -1.59472786]
        - [-346.65974125954, 27.17740170782, 4.95720537, 1.19532447]
        - [-347.70156772650, 7.02271181953, -7.26982751, -4.11005369]
        - [-342.35751882878, -21.62420952972, -3.08007924, 1.04357423]
        - [-327.42535024984, 17.96055213746, 0.66205961, 1.49879944]
        - [-328.67601044709, -17.52660028381, 6.93840996, 0.09472237]

    require_translation_corrected_lidar: true

    # Bounds are defined from the complete 11-position dataset before fitting,
    # then padded by about 10 mm. They are distinct from the planner's physical
    # workspace and continue to fail closed for model outputs outside measured
    # command-space coverage.
    input_bounds_mm:
      min_x_mm: -447.0
      max_x_mm: -317.0
      min_y_mm: -70.0
      max_y_mm: 70.0
    output_bounds_mm:
      min_x_mm: -455.0
      max_x_mm: -305.0
      min_y_mm: -100.0
      max_y_mm: 65.0

    source:
      session_id: grasp-waypoint-v1
      capture_date: "2026-08-19"
      sample_count: 11
      capture_order: far_to_near_across_left_right_workspace
      coordinate_reference: manually_taught_roarm_t105_gripper_centre
      planner_offsets_during_fit_mm: [10.0, -15.0]
      measured_nominal_x_range_mm: [-436.7151, -327.4254]
      measured_nominal_y_range_mm: [-59.5580, 57.9575]
      measured_manual_x_range_mm: [-433.0988, -306.3225]
      measured_manual_y_range_mm: [-101.9475, 35.9580]
      global_bilinear_training_planar_rmse_mm: 5.8662
      global_bilinear_training_max_error_mm: 11.8469
      local_residual_basis: wendland_c2
      local_residual_support_radius_mm: 20.0
      local_residual_fit_ridge: 0.1
      training_planar_rmse_mm: 0.5350
      training_max_error_mm: 1.0770
      leave_one_position_out_planar_rmse_mm: 7.9574
      leave_one_position_out_max_error_mm: 13.0411
      prior_model_overlapping_points_planar_rmse_mm: 21.3697
      z_fit_enabled: false
      note: manual T105 poses are command-space references, not external absolute world ground truth

    # The fitted model is valid only while these geometric inputs remain
    # identical. Config loading fails closed if one changes accidentally.
    expected_inputs:
      app_target: tissue_pack
      target_z_mm: -110.0
      camera_fx_px: 900.0
      camera_cx_px: 320.0
      camera_origin_in_base_mm: [-260.0, 0.0, -70.0]
      camera_yaw_in_base_deg: 180.0
      lidar_origin_in_base_mm: [-260.0, 0.0, -100.0]
      lidar_front_angle_deg: 180.0
      lidar_angle_sign: 1
      arm_origin_in_base_mm: [0.0, 0.0, 0.0]
      arm_yaw_in_base_deg: 0.0

arm_mount:
  origin_in_base_mm: [0.0, 0.0, 0.0]
  yaw_in_base_deg: 0.0

planner:
  approach_distance_mm: 80.0
  pregrasp_height_mm: 300.0
  lift_height_mm: 200.0

  # Retained for compatibility with the validated grasp convention. The new
  # workspace-first calibration was fitted with these offsets explicitly accounted for.
  grasp_x_offset_mm: 10.0
  grasp_y_offset_mm: -15.0

  tool_angle_rad: 3.14
  cartesian_speed: 0.15
  gripper_open_rad: 2.20
  gripper_closed_rad: 3.14

workspace:
  # XY workspace is authorized independently of the fitted calibration.
  # All 11 manually taught XY grasp positions and their pre-offset commands are
  # inside this region. The most demanding taught pre-offset point has a
  # 3-D radius of 463.9 mm at the fixed Z=-110 mm; 480 mm preserves margin.
  min_x_mm: -460.0
  max_x_mm: 500.0
  min_y_mm: -120.0
  max_y_mm: 120.0
  min_z_mm: -120.0
  max_z_mm: 280.0
  max_radius_mm: 480.0

arm:
  mode: real                 # mock | real
  device: /dev/ttyROARM
  baudrate: 115200

  allow_real_motion: true
  confirm_clearance: true
  require_typed_confirmation: true
  confirmation_phrase: EXECUTE ONE GRASP

  one_grasp_per_process: true
  feedback_tolerance_mm: 20.0
  waypoint_timeout_s: 25.0
  feedback_poll_s: 0.20
  feedback_initial_delay_s: 1.0
  uart_response_timeout_s: 2.0

  gripper_settle_s: 1.0
  gripper_speed_steps_s: 250
  gripper_acceleration: 10
  gripper_motion_margin_s: 0.75

  min_voltage_v: 7.0
  max_voltage_v: 13.0

pipeline:
  allow_provisional_in_mock: true

  # Run a second Camera + RPLIDAR observation immediately before planning.
  # The second observation becomes the target that is actually planned/executed.
  pre_execute_recheck: true
  recheck_timeout_s: 8.0

  # Reject a target that moved significantly between the two observations.
  max_recheck_center_shift_px: 60.0
  max_recheck_target_shift_mm: 60.0

  # Reject a noisy/mixed RPLIDAR sector before it reaches the planner.
  max_range_mad_mm: 60.0
  max_range_span_mm: 250.0

# Append one structured record for every completed, aborted, or failed run.
# JSONL is the source of truth; CSV mirrors the most useful analysis columns.
experiment:
  enabled: true
  profile: real_grasp
  output_dir: /workspace/logs/experiments
  jsonl_filename: runs.jsonl
  csv_filename: runs.csv
  require_mock_arm: false

# Existing standalone manual-arm test configuration retained.
manual_arm_test:
  enabled: true
  allow_real_motion: true
  confirm_clearance: true
  coordinates_approved: true

  execute_confirmation_phrase: EXECUTE MANUAL ROARM GRASP
  reset_confirmation_phrase: RESET ROARM TO INITIAL POSITION
  gripper_confirmation_phrase: MOVE ROARM GRIPPER

  reset_wait_s: 8.0
  reset_timeout_s: 25.0

  feedback_tolerance_mm: 12.0
  uart_response_timeout_s: 2.0
  feedback_initial_delay_s: 1.0
  waypoint_timeout_s: 25.0
  feedback_poll_s: 0.50
  gripper_settle_s: 1.0

  tool_angle_rad: 3.14
  cartesian_speed: 0.20
  gripper_open_rad: 2.2
  gripper_closed_rad: 3.14

  gripper_speed_steps_s: 400
  gripper_acceleration: 10
  gripper_motion_margin_s: 0.75

  waypoints:
    pregrasp: [-310, -5, 230]
    grasp:    [-320, -20, -110]
    lift:     [-350, -5, 100]
    retreat:  [-310, -5, 230]
