default_velocity_scaling_factor: 0.20
default_acceleration_scaling_factor: 0.20

joint_limits:
  base_link_to_link1:
    has_position_limits: true
    min_position: -3.1415926536
    max_position: 3.1415926536
    has_velocity_limits: true
    max_velocity: 0.35
    has_acceleration_limits: true
    max_acceleration: 0.70
  link1_to_link2:
    has_position_limits: true
    min_position: -1.5707963268
    max_position: 1.5707963268
    has_velocity_limits: true
    max_velocity: 0.35
    has_acceleration_limits: true
    max_acceleration: 0.70
  link2_to_link3:
    # The firmware rejects negative elbow angles even though the vendor mesh
    # URDF permits them.  Keep planning inside the measured hardware range.
    has_position_limits: true
    min_position: 0.0
    max_position: 2.95
    has_velocity_limits: true
    max_velocity: 0.35
    has_acceleration_limits: true
    max_acceleration: 0.70
