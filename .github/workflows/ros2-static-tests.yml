name: ROS 2 arm-only static tests

on:
  pull_request:
    paths:
      - "src/ros2_ws/**"
      - ".github/workflows/ros2-static-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/ros2_ws/**"
      - ".github/workflows/ros2-static-tests.yml"

jobs:
  no-ros-safety-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate Python, XML and gripper isolation
        run: python3 src/ros2_ws/test_static.py
      - name: Run pure arm mapping and trajectory guard tests
        env:
          PYTHONPATH: src/ros2_ws/src/eee8097_roarm_driver
        run: >-
          python3 -m unittest discover
          -s src/ros2_ws/src/eee8097_roarm_driver/test -v

  ros2-humble-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: humble
      - name: Install MoveIt 2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-serial \
            ros-humble-joint-state-publisher \
            ros-humble-moveit \
            ros-humble-robot-state-publisher \
            ros-humble-rviz2 \
            ros-humble-xacro
      - name: Fetch pinned Waveshare packages
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/waveshareteam/roarm_ws.git /tmp/roarm_ws
          git -C /tmp/roarm_ws sparse-checkout init --cone
          git -C /tmp/roarm_ws sparse-checkout set \
            src/roarm_main/roarm_description \
            src/roarm_main/roarm_moveit \
            src/roarm_main/roarm_moveit_ikfast_plugins
          git -C /tmp/roarm_ws checkout 40dbd84b553695212fab713e8465f817ba95454d
          mkdir -p src/ros2_ws/src/waveshare_roarm
          cp -a /tmp/roarm_ws/src/roarm_main/. src/ros2_ws/src/waveshare_roarm/
      - name: Build ROS 2 packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd src/ros2_ws
          colcon build --event-handlers console_direct+ --packages-up-to \
            eee8097_moveit_config
      - name: Run ROS package tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source src/ros2_ws/install/setup.bash
          cd src/ros2_ws
          colcon test --event-handlers console_direct+ \
            --packages-select eee8097_roarm_driver
          colcon test-result --verbose
