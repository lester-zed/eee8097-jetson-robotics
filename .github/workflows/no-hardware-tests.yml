name: No-hardware tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install no-hardware test dependencies
        run: python -m pip install PyYAML==6.0.2 pyserial==3.5

      - name: Validate configuration and run unit tests
        working-directory: src
        run: bash test_modular_pipeline.sh

